<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>System Dashboard</h1>
  </header>

  <main>
    <section class="card" aria-labelledby="system-title">
      <div class="card-head">
        <h2 id="system-title">System</h2>
      </div>

      <dl class="info">
        <dt>Host Name</dt>
        <dd id="system-host">…</dd>
        <dt>IP Addresses</dt>
        <dd id="system-ips">…</dd>
      </dl>
      <p id="system-status" class="error" role="alert" hidden></p>
    </section>

    <div class="tabs" role="tablist" aria-label="Lists">
      <button id="tab-software" type="button" role="tab" data-tab="software"
        aria-controls="panel-software" aria-selected="true">Installed Software</button>
      <button id="tab-executables" type="button" role="tab" data-tab="executables"
        aria-controls="panel-executables" aria-selected="false" tabindex="-1">Executables</button>
    </div>

    <section id="panel-software" class="card" role="tabpanel" aria-labelledby="tab-software">
      <div class="card-head">
        <h2>Installed software</h2>
        <span id="software-count" class="badge"></span>
        <div class="spacer"></div>
        <input id="software-filter" type="search" placeholder="Filter by name or version" aria-label="Filter installed software">
        <button id="software-refresh" type="button">Refresh</button>
        <div class="download">
          <label for="software-format">Download Format</label>
          <select id="software-format">
            <option value="text">text</option>
            <option value="csv">csv</option>
            <option value="json">json</option>
            <option value="html">html</option>
          </select>
          <button id="software-download" type="button" disabled>Download</button>
        </div>
      </div>

      <p id="software-time" class="muted"></p>
      <p id="software-status" class="muted" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col" data-sort="Name">Name</th>
              <th scope="col" data-sort="Version">Version</th>
            </tr>
          </thead>
          <tbody id="software-body"></tbody>
        </table>
      </div>
    </section>

    <section id="panel-executables" class="card" role="tabpanel" aria-labelledby="tab-executables" hidden>
      <div class="card-head">
        <h2>Executables</h2>
        <span id="executables-count" class="badge"></span>
        <div class="spacer"></div>
        <input id="executables-filter" type="search" placeholder="Filter by name or directory" aria-label="Filter executables">
        <button id="executables-scan" type="button">Scan</button>
        <div class="download">
          <label for="executables-format">Download Format</label>
          <select id="executables-format">
            <option value="text">text</option>
            <option value="csv">csv</option>
            <option value="json">json</option>
            <option value="html">html</option>
          </select>
          <button id="executables-download" type="button" disabled>Download</button>
        </div>
      </div>

      <fieldset class="categories">
        <legend>Categories</legend>
        <label><input id="executables-all" type="checkbox"> All</label>
        <label><input type="checkbox" name="category" value="executable" checked> Executables</label>
        <label><input type="checkbox" name="category" value="library"> Dynamic Libraries</label>
        <label><input type="checkbox" name="category" value="script"> Scripts</label>
        <label><input type="checkbox" name="category" value="installer"> Installers</label>
        <label><input type="checkbox" name="category" value="other"> Others</label>
      </fieldset>

      <p id="executables-time" class="muted"></p>
      <p id="executables-status" class="muted" role="status">Choose the categories and press Scan. Searching the local disks can take several minutes.</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col" data-sort="Name">Name</th>
              <th scope="col" data-sort="Directory">Directory</th>
              <th scope="col" data-sort="Size" class="num">Size</th>
              <th scope="col" data-sort="Modified">Modified</th>
              <th scope="col" data-sort="Category">Category</th>
            </tr>
          </thead>
          <tbody id="executables-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
